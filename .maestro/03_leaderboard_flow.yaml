appId: host.exp.exponent
---
- launchApp
- waitForAnimationToEnd

# Sign in if needed
- runFlow:
    when:
      visible: "Sign In"
    flow:
      - tapOn: "Email"
      - inputText: "${TEST_EMAIL}"
      - tapOn: "Password"
      - inputText: "${TEST_PASSWORD}"
      - tapOn: "Sign In"
      - waitForAnimationToEnd

# Navigate to Leaderboard tab
- tapOn: "Leaderboard"
- waitForAnimationToEnd

# Header elements
- assertVisible: "Leaderboard"
- assertVisible: "Reaction Board — best times"

# If at least one score exists, the current team row should be highlighted with (you)
- runFlow:
    when:
      visible: "you"
    flow:
      - assertVisible: "you"
      - assertVisible: "ms"

# Pull-to-refresh — scroll down then up to trigger RefreshControl
- scroll:
    direction: DOWN
    duration: 300
- scroll:
    direction: UP
    duration: 300
- waitForAnimationToEnd
